name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is wasted compute; the newest push wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # PasswordResetFlowIntegrationTest and OtpExpirationTest read real mail back
    # out of Mailpit's REST API on :8025, and neither has a skip guard, so the
    # container has to exist here or the suite fails — which is exactly how this
    # workflow failed on its first run.
    #
    # MySQL is deliberately NOT declared: the repository and integration tests
    # start their own through Testcontainers, against the runner's Docker daemon.
    services:
      mailpit:
        image: axllent/mailpit:v1.28
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Repository and integration tests drive a real MySQL through
      # Testcontainers, which uses the Docker daemon already present on the
      # ubuntu runner. No service container is declared for that reason.
      # A service container being "started" does not mean it is accepting
      # requests yet; without this the first mail assertion can race it.
      - name: Wait for Mailpit
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8025/api/v1/messages >/dev/null 2>&1; then
              echo "Mailpit is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Mailpit did not become ready within 60s" >&2
          exit 1

      - name: Run the suite
        working-directory: backend
        run: ./mvnw -B test

      # Kept for the doc-figures job, which counts tests from these reports
      # rather than re-running Maven.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/*.xml
          retention-days: 7

  frontend:
    name: Frontend tests, build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  doc-figures:
    name: Documented test counts match the suites
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download surefire reports
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

      # --reuse-backend counts the downloaded reports instead of spending
      # another few minutes on Maven; the frontend suite runs in seconds, so
      # the script always runs that one fresh.
      - name: Check the figures
        run: python3 scripts/check-doc-figures.py --reuse-backend
