#
# SmartCampus ERP - production profile overrides (Phase 12, scope 71).
#
# Activated with SPRING_PROFILES_ACTIVE=prod. Spring merges this file on TOP of
# application.properties - every key below already exists there under the same
# name; this file only changes which value wins in prod. It introduces NO new
# property names and NO secrets - every secret-bearing key (DB_URL, DB_PASSWORD,
# JWT_SECRET, AI_API_KEY, SMTP_*, JUDGE0_*) keeps coming from the environment via
# the ${VAR:default} placeholders already defined in application.properties;
# nothing here overrides those defaults with a real value.
#
# The seed profile ("seed") must NEVER be combined with "prod" - DevDataSeeder
# enforces this itself at runtime as a second, code-level guard (see its class
# javadoc). This file cannot express that rule; it is documented here so anyone
# assembling SPRING_PROFILES_ACTIVE for a deployment sees the warning next to the
# other prod-only settings.
#

# ---------------------------------------------------------------------------
# API documentation (springdoc-openapi, added by Phase 12 task 1) - OFF by
# default in production. Reuses the same SWAGGER_ENABLED env var the base
# config binds these keys to (default true there); the default flips to false
# here, so an operator who genuinely wants Swagger reachable in prod still can
# by setting SWAGGER_ENABLED=true explicitly - this file does not forbid it,
# it just refuses to expose API docs publicly by accident.
#
# Property names confirmed against application.properties as actually implemented:
# springdoc.api-docs.enabled / springdoc.swagger-ui.enabled, both already bound to
# ${SWAGGER_ENABLED:true} there - this file only changes the default that wins.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ---------------------------------------------------------------------------
# SQL logging - OFF. Base default is already false; restated explicitly here
# so a prod deployment is correct even if someone left SQL_LOGGING=true set in
# a shared environment left over from debugging.
# ---------------------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------------------------------------------------------------------------
# Actuator - health only in prod, and health details never exposed (the base
# default is "when-authorized", which would otherwise leak DB/disk detail to
# any authenticated caller). /actuator/info is dropped from the exposure list.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Flyway - out-of-order defaults to FALSE in prod. The dev default is true only
# because parallel build waves applied migrations out of numeric order against
# the shared dev database; a fresh production database receives V1..V12 in
# order and should fail loudly (not silently accept) an out-of-sequence
# migration. Still overridable via FLYWAY_OUT_OF_ORDER if a specific prod
# deployment genuinely needs it.
# ---------------------------------------------------------------------------
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}

# ---------------------------------------------------------------------------
# Logging levels - INFO/WARN in prod, no DEBUG/TRACE noise.
# ---------------------------------------------------------------------------
logging.level.root=WARN
logging.level.smartcampus=${APP_LOG_LEVEL:INFO}
