#
# SmartCampus ERP - backend configuration
#
# Every value below is environment-driven using ${VAR:default} placeholders. The
# defaults are the local development values from docker-compose.yml and are safe to
# commit. Real secrets (JWT signing key, AI API key, SMTP credentials) have EMPTY
# defaults and must be supplied through the environment - see .env.example at the
# repository root. Never put a real secret in this file.
#

spring.application.name=smartcampus

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# Datasource (MySQL 8.4 - docker-compose service "mysql")
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartcampus}
spring.datasource.username=${DB_USERNAME:smartcampus}
spring.datasource.password=${DB_PASSWORD:smartcampus}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=smartcampus-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# ddl-auto=validate is mandatory (PROJECT_PLAN.md clarification G8): Flyway owns the
# schema, Hibernate only checks that the entity mapping matches it. Hibernate must
# never create or alter a table.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL logging is off by default; flip SQL_LOGGING=true locally when debugging a query.
spring.jpa.show-sql=${SQL_LOGGING:false}
spring.jpa.properties.hibernate.format_sql=${SQL_LOGGING:false}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------------------------------------------------------------------------
# Flyway - the single source of truth for the database schema
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate stays FALSE deliberately: against a schema that already has
# objects but no history table, "true" would silently skip V1 and leave the database
# in an undefined state. "false" fails loudly instead, which is what we want.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------------------
# Actuator - health and info only. Nothing else is exposed over HTTP, and only
# /actuator/health is unauthenticated; /actuator/info requires authentication
# (which arrives in Phase 2).
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read-only
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.health.db.enabled=true
management.info.env.enabled=true
info.app.name=SmartCampus ERP
info.app.description=College ERP - backend API

# ---------------------------------------------------------------------------
# Mail (Mailpit in development: SMTP on 1025, web UI on 8025)
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# JWT (implemented in Phase 2). No default secret - the app must be given one.
# JWT_EXPIRATION is in milliseconds; the default is 24 hours.
# ---------------------------------------------------------------------------
smartcampus.jwt.secret=${JWT_SECRET:}
smartcampus.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------------------
# AI provider (implemented in Phase 6). OpenAI-compatible Chat Completions API.
# Credentials stay server-side and are never sent to the browser.
# ---------------------------------------------------------------------------
smartcampus.ai.provider=${AI_PROVIDER:groq}
smartcampus.ai.api-key=${AI_API_KEY:}
smartcampus.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
smartcampus.ai.model=${AI_MODEL:}

# ---------------------------------------------------------------------------
# Judge0 code execution (implemented in Phase 7). Self-hosted in docker-compose,
# so the API key is empty locally.
# ---------------------------------------------------------------------------
smartcampus.judge0.url=${JUDGE0_URL:http://localhost:2358}
smartcampus.judge0.api-key=${JUDGE0_API_KEY:}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.smartcampus=${APP_LOG_LEVEL:INFO}
