#
# SmartCampus ERP - backend configuration
#
# Every value below is environment-driven using ${VAR:default} placeholders. The
# defaults are the local development values from docker-compose.yml and are safe to
# commit. Real secrets (JWT signing key, AI API key, SMTP credentials) have EMPTY
# defaults and must be supplied through the environment - see .env.example at the
# repository root. Never put a real secret in this file.
#

spring.application.name=smartcampus

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# Datasource (MySQL 8.4 - docker-compose service "mysql")
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartcampus}
spring.datasource.username=${DB_USERNAME:smartcampus}
spring.datasource.password=${DB_PASSWORD:smartcampus}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=smartcampus-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# ddl-auto=validate is mandatory (PROJECT_PLAN.md clarification G8): Flyway owns the
# schema, Hibernate only checks that the entity mapping matches it. Hibernate must
# never create or alter a table.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL logging is off by default; flip SQL_LOGGING=true locally when debugging a query.
spring.jpa.show-sql=${SQL_LOGGING:false}
spring.jpa.properties.hibernate.format_sql=${SQL_LOGGING:false}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---------------------------------------------------------------------------
# Flyway - the single source of truth for the database schema
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate stays FALSE deliberately: against a schema that already has
# objects but no history table, "true" would silently skip V1 and leave the database
# in an undefined state. "false" fails loudly instead, which is what we want.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# out-of-order allows a migration whose version is BELOW the current schema version to
# still be applied. Phases are built in parallel waves and each phase owns a
# pre-assigned version, so they do not land in numeric order: Phase 7 (V7) was built
# alongside Phase 4 (V4) and reached the database before Phase 5 (V5) and Phase 6 (V6)
# existed. Without this, Flyway refuses to start with "Detected resolved migration not
# applied to database: 5". Each version still applies exactly once, in a recorded order,
# and validate-on-migrate above still fails loudly on a CHANGED migration - this relaxes
# only the arrival order, which is safe here because every phase creates its own tables
# rather than altering an earlier phase's.
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:true}

# ---------------------------------------------------------------------------
# Actuator - health and info only. Nothing else is exposed over HTTP, and only
# /actuator/health is unauthenticated; /actuator/info requires authentication
# (which arrives in Phase 2).
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read-only
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.health.db.enabled=true
management.info.env.enabled=true
info.app.name=SmartCampus ERP
info.app.description=College ERP - backend API

# ---------------------------------------------------------------------------
# Mail (Mailpit in development: SMTP on 1025, web UI on 8025)
# ---------------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# CORS (§61, §71)
#
# Comma-separated allowlist of browser origins permitted to call the API. This dev
# default must track the port vite.config.ts pins the dev server to (5175 - 5173 and
# 5174 were taken by other local stacks). The older Vite defaults are kept so a clone
# running on them still works; an origin missing from this list surfaces in the
# browser as a CORS failure that looks like a broken backend rather than a port clash.
# Production must narrow this to the deployed frontend origin only.
# ---------------------------------------------------------------------------
smartcampus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:5173,http://localhost:5174}

# ---------------------------------------------------------------------------
# JWT (implemented in Phase 2). No default secret - the app must be given one.
# JWT_EXPIRATION is in milliseconds; the default is 24 hours.
# ---------------------------------------------------------------------------
smartcampus.jwt.secret=${JWT_SECRET:}
smartcampus.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------------------
# Password reset OTP (Phase 2)
# ---------------------------------------------------------------------------
smartcampus.password-reset.otp-expiration-minutes=${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:15}
smartcampus.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
smartcampus.mail.from=${MAIL_FROM:noreply@smartcampus.local}

# ---------------------------------------------------------------------------
# Attendance (Phase 4). The minimum attendance percentage below which a student
# is warned (§18 low-attendance warnings). Configurable, never hard-coded.
# ---------------------------------------------------------------------------
smartcampus.attendance.minimum-percentage=${ATTENDANCE_MINIMUM_PERCENTAGE:75}

# ---------------------------------------------------------------------------
# Analytics (Phase 5). Trend window in whole calendar months; the request's
# ?months param overrides it and is clamped to max-trend-months.
# ---------------------------------------------------------------------------
smartcampus.analytics.trend-months=${ANALYTICS_TREND_MONTHS:6}
smartcampus.analytics.max-trend-months=${ANALYTICS_MAX_TREND_MONTHS:24}
smartcampus.analytics.at-risk-list-limit=${ANALYTICS_AT_RISK_LIST_LIMIT:20}

# ---------------------------------------------------------------------------
# AI provider (implemented in Phase 6). OpenAI-compatible Chat Completions API.
# Credentials stay server-side and are never sent to the browser.
# ---------------------------------------------------------------------------
smartcampus.ai.provider=${AI_PROVIDER:groq}
smartcampus.ai.api-key=${AI_API_KEY:}
smartcampus.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
smartcampus.ai.model=${AI_MODEL:}
smartcampus.ai.model-preferences=${AI_MODEL_PREFERENCES:llama-3.3-70b-versatile,llama-3.1-8b-instant,openai/gpt-oss-120b,openai/gpt-oss-20b,meta-llama/llama-4-scout-17b-16e-instruct,qwen/qwen3-32b}
smartcampus.ai.model-cache-minutes=${AI_MODEL_CACHE_MINUTES:30}
smartcampus.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
smartcampus.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:60000}
smartcampus.ai.temperature=${AI_TEMPERATURE:0.3}
smartcampus.ai.max-tokens=${AI_MAX_TOKENS:2048}
smartcampus.ai.rate-limit.per-minute=${AI_RATE_LIMIT_PER_MINUTE:5}
smartcampus.ai.rate-limit.per-day=${AI_RATE_LIMIT_PER_DAY:100}
smartcampus.ai.context.upcoming-exam-limit=${AI_CONTEXT_UPCOMING_EXAM_LIMIT:10}
smartcampus.ai.context.history-message-limit=${AI_CONTEXT_HISTORY_MESSAGE_LIMIT:20}
smartcampus.ai.weak-subject.marks-threshold=${AI_WEAK_SUBJECT_MARKS_THRESHOLD:50}

# ---------------------------------------------------------------------------
# Judge0 code execution (implemented in Phase 7). Self-hosted in docker-compose,
# so the API key is empty locally.
# ---------------------------------------------------------------------------
smartcampus.judge0.url=${JUDGE0_URL:http://localhost:2358}
smartcampus.judge0.api-key=${JUDGE0_API_KEY:}
# `auth-header` / `host-header` are what make self-hosted vs hosted (RapidAPI) a config
# switch rather than a code change (clarification G10 / open decision D1): leave api-key
# empty for a self-hosted instance, or set JUDGE0_URL=https://judge0-ce.p.rapidapi.com,
# JUDGE0_API_KEY=<key>, JUDGE0_HOST_HEADER=judge0-ce.p.rapidapi.com for RapidAPI.
smartcampus.judge0.auth-header=${JUDGE0_AUTH_HEADER:X-RapidAPI-Key}
smartcampus.judge0.host-header=${JUDGE0_HOST_HEADER:}
smartcampus.judge0.connect-timeout-ms=${JUDGE0_CONNECT_TIMEOUT_MS:5000}
smartcampus.judge0.read-timeout-ms=${JUDGE0_READ_TIMEOUT_MS:15000}
smartcampus.judge0.poll-interval-ms=${JUDGE0_POLL_INTERVAL_MS:400}
smartcampus.judge0.poll-timeout-ms=${JUDGE0_POLL_TIMEOUT_MS:30000}
smartcampus.judge0.language-id.java=${JUDGE0_LANGUAGE_ID_JAVA:62}
smartcampus.judge0.language-id.cpp=${JUDGE0_LANGUAGE_ID_CPP:54}

# ---------------------------------------------------------------------------
# Global coding leaderboard: points awarded per DISTINCT problem solved, by
# difficulty. Configurable rather than hard-coded (§60).
# ---------------------------------------------------------------------------
smartcampus.coding.points.easy=${CODING_POINTS_EASY:10}
smartcampus.coding.points.medium=${CODING_POINTS_MEDIUM:20}
smartcampus.coding.points.hard=${CODING_POINTS_HARD:30}

# ---------------------------------------------------------------------------
# Real-time notifications (Phase 11). The WebSocket handshake is authenticated by
# JwtHandshakeInterceptor using the ?token= JWT and its allowed origins come from
# smartcampus.cors.allowed-origins above — there is deliberately no second origin
# list to drift out of sync.
# ---------------------------------------------------------------------------
smartcampus.realtime.max-sessions-per-user=${REALTIME_MAX_SESSIONS_PER_USER:5}
smartcampus.notifications.fanout-batch-size=${NOTIFICATION_FANOUT_BATCH_SIZE:500}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (§63). SWAGGER_ENABLED gates both the raw JSON and the UI so
# an operator can turn documentation off in production with one env var, no code
# change. Grouping (13 groups matching §63's module list) lives in OpenApiConfig;
# reachability (permitAll before anyRequest().authenticated()) lives in SecurityConfig.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# ---------------------------------------------------------------------------
# Auth endpoint rate limiting (§61) - in-memory fixed-window counter keyed on
# client IP (+ email, where the request body carries one) applied to
# POST /api/auth/login, POST /api/auth/register and POST /api/auth/password-reset/**.
# See smartcampus.security.AuthRateLimiter / AuthRateLimitFilter for why this is
# in-memory only (does not survive a restart, does not coordinate across replicas).
# ---------------------------------------------------------------------------
smartcampus.security.auth-rate-limit.per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}
smartcampus.security.auth-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.smartcampus=${APP_LOG_LEVEL:INFO}
