#
# Profile-specific configuration for the "seed" Spring profile (Phase 12, scope-65 dev
# seed data). Auto-loaded by Spring Boot ONLY when the "seed" profile is active, on top
# of (never instead of) the main application.properties.
#
# smartcampus.seed.enabled is the SECOND of DevDataSeeder's two required switches — see
# smartcampus.seed.DevDataSeeder's javadoc. The profile being active is NOT enough on its
# own: the default below is "false", so activating the "seed" profile alone (e.g. by
# accident, or because some other unrelated bean also happens to be profile-gated on
# "seed" one day) still does not seed anything. Both `SPRING_PROFILES_ACTIVE=seed` AND
# `SMARTCAMPUS_SEED_ENABLED=true` must be set together — the exact activation contract
# documented in README.md and in AGENT_CONTEXT.md Addendum 4.
#
# This file must NEVER be loaded by default (no profile means no file), and NEVER carry
# a real secret — it only ever governs development-only, throwaway seed data.
#
smartcampus.seed.enabled=${SMARTCAMPUS_SEED_ENABLED:false}
