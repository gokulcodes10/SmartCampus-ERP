#
# Test-only overrides. Loaded ahead of src/main/resources/application.properties when
# the test classpath is active.
#
# The main configuration deliberately gives smartcampus.jwt.secret an EMPTY default so
# that a real deployment cannot silently boot with a guessable signing key - JwtService
# fails fast instead. That is correct for production but makes `./mvnw test` depend on
# an exported JWT_SECRET, which would break CI and any fresh clone. This file supplies a
# throwaway signing key for tests only.
#
# This value is NOT a secret and must never be used outside tests: it is committed, so
# any token it signs is forgeable by anyone with the repository.
#
smartcampus.jwt.secret=test-only-signing-key-not-a-secret-min-32-bytes-abcdefghijklmnop
smartcampus.jwt.expiration=86400000

# Testcontainers supplies the datasource (see TestcontainersConfiguration), and Flyway
# runs its real migrations against it, so nothing datasource-related is set here.

# Mail: integration tests talk to the real Mailpit container on the standard dev port.
spring.mail.host=localhost
spring.mail.port=1025

# Phase 4: mirrors src/main/resources so the attendance warning threshold resolves in
# tests too. This file shadows the main one; it does not merge with it.
smartcampus.attendance.minimum-percentage=75

# Phase 5: mirrors src/main/resources; this file shadows it, it does not merge.
smartcampus.analytics.trend-months=6
smartcampus.analytics.max-trend-months=24
smartcampus.analytics.at-risk-list-limit=20

# Phase 11: mirrors src/main/resources; this file shadows it, it does not merge.
smartcampus.realtime.max-sessions-per-user=5
smartcampus.notifications.fanout-batch-size=500
