# SmartCampus ERP - frontend nginx server block (scope 71).
#
# Intended to be copied to /etc/nginx/conf.d/default.conf inside the nginx:1.27-alpine
# base image (see frontend/Dockerfile) - it relies on that image's own top-level
# nginx.conf for the surrounding events{}/http{} wrapper, mime.types include, gzip,
# etc. It is a server block only, not a full nginx.conf.
#
# Two jobs:
#   1. SPA history fallback - React Router owns client-side routes like /students/42;
#      nginx must serve index.html for any path it doesn't have a file for, instead
#      of 404ing, or a hard refresh on a deep link breaks.
#   2. Reverse proxy /api and /ws to the backend container, using the docker-compose
#      service name "backend" as the hostname (Docker's embedded DNS resolves it).
#      This is why the frontend image is built with VITE_API_BASE_URL="" (see
#      frontend/Dockerfile) - the browser calls same-origin /api/... and nginx
#      forwards it, so the deployed frontend origin never has to know the backend's
#      real address.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Resolve "backend" through Docker's embedded DNS at REQUEST time (127.0.0.11,
    # true on every stock Docker network) rather than once at nginx startup. A plain
    # `proxy_pass http://backend:8080;` resolves the hostname when nginx reads this
    # config and is fixed after that — if the backend container is not yet up or is
    # ever recreated (a new IP), nginx either refuses to start at all ("host not
    # found in upstream", verified against this exact file) or keeps proxying to a
    # dead IP. Using a variable forces nginx to re-resolve per request instead, so a
    # backend restart degrades to failed /api calls rather than taking the whole
    # static frontend down with it.
    resolver 127.0.0.11 valid=30s;

    # Static assets: Vite fingerprints filenames, so these are safe to cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # REST API -> Spring Boot backend.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass         $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Real-time notifications -> Spring Boot backend, upgraded to a WebSocket.
    location /ws/ {
        set $backend_upstream http://backend:8080;
        proxy_pass         $backend_upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
    }

    # SPA fallback - everything else that isn't a real static file resolves to
    # index.html so React Router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
